name: Build Android APK

# Builds a debug .apk on every push to main and lets you trigger it
# manually from the Actions tab. The finished file is published as a
# GitHub Release asset (a direct .apk download link, not a zip) — no
# local Android Studio needed.
#
# Why a Release instead of a plain workflow artifact: Chrome/Safe Browsing
# tends to flag a .zip containing an .apk from an unfamiliar link as a false
# positive ("Vírus detectado"). A Release asset is a direct, unwrapped .apk
# download through GitHub's own release CDN, which doesn't hit that heuristic.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # @capacitor/android's own build.gradle hardcodes sourceCompatibility/
      # targetCompatibility to Java 21 (node_modules/@capacitor/android/capacitor/build.gradle)
      # — JDK 17 fails with "invalid source release: 21". Match it here.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform + build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web app + sync Capacitor
        run: npm run build:android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK (build history / workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: RealLifeTrack-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Rolling "debug-latest" release, recreated on every build, so there's
      # always one stable direct-download link for the APK — see the note
      # at the top of this file for why this replaced a plain artifact link.
      - name: Publish APK as a GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create debug-latest \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "RLT Debug APK (build mais recente)" \
            --notes "Build automático a partir do commit ${{ github.sha }}. Debug build, não assinado para produção — apenas para teste." \
            --prerelease
